<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520">
  <g id="guides">
    <rect x="0.5" y="0.5" width="799" height="519" fill="none" stroke="#cccccc" stroke-dasharray="6 6"/>
    <text x="400" y="430" font-size="12" fill="#888888" font-family="sans-serif" text-anchor="middle">padlink controller template (xbox). Draw your artwork over these shapes.</text>
    <text x="400" y="448" font-size="12" fill="#888888" font-family="sans-serif" text-anchor="middle">Keep the object NAMES (they become ids). Interactive parts must be single shapes, not groups.</text>
    <text x="400" y="466" font-size="12" fill="#888888" font-family="sans-serif" text-anchor="middle">Black (#000000) strokes/fills follow the light/dark theme. Other colours are kept as drawn.</text>
    <text x="400" y="484" font-size="12" fill="#888888" font-family="sans-serif" text-anchor="middle">Export: SVG, Presentation Attributes, Convert text to outlines, Object IDs = Layer Names, Responsive on.</text>
    <text x="400" y="502" font-size="12" fill="#888888" font-family="sans-serif" text-anchor="middle">This 'guides' layer is hidden by padlink. Delete it or leave it.</text>
  </g>
