name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # evdev is pinned: code names in the golden fixtures depend on its alias tables
      - run: pip install evdev==2.0.0 pyudev==0.24.4 PyYAML==6.0.3
      - name: Unit tests (live uinput and GTK rendering tests skip themselves)
        run: python -m unittest discover -s tests -v
      - name: Golden fixtures are up to date
        run: python tools/gen_fixtures.py --check

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
