[package]
name = "padlink-gtk"
description = "padlink GTK4/libadwaita app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "padlink-gtk"
path = "src/main.rs"

[dependencies]
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_4", "gtk_v4_10"] }
# GTK 4.12 APIs (ListBox::remove_all, CssProvider::load_from_string); Ubuntu 24.04 ships 4.14
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_12"] }
evdev.workspace = true
glib-unix = "0.22.8"
libc.workspace = true
padlink-core = { path = "../padlink-core" }
rsvg = { package = "librsvg-rebind", version = "0.3.0" }
serde_json.workspace = true
udev.workspace = true
