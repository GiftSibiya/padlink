[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "padlink"
version = "0.1.0"
description = "Wireless controller companion for Linux: detection, diagnostics, logging and a rumble bridge"
license = "MIT"
requires-python = ">=3.11"
# System packages (Arch): python-evdev python-pyudev python-gobject gtk4 libadwaita python-yaml
dependencies = ["evdev", "pyudev", "PyYAML"]

[project.scripts]
padlink = "padlink.cli:main"

[project.gui-scripts]
padlink-gtk = "padlink.gtk.app:main"

[tool.setuptools.packages.find]
include = ["padlink*"]

[tool.setuptools.package-data]
"padlink.gtk" = ["art/*.svg"]
